discussion:
  instructions: |
    {{fragment "shared.discussion_frame"
      example="dot.setAttribute('cx', String(26 + col * STEP));"
      scope="after the grid and game chapter of the SVG part"
      reveal=false
      knows=(array
        "`document.querySelector<HTMLButtonElement>('#up')` with an `if (!element) { throw ... }` null check"
        "`textContent`, `createElement`, `append`, `remove`, and `classList`"
