# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/evals/eval-yaml.schema.json
# Golden answers for 0020-svg-dom-quiz.yaml ("SVG elements are DOM objects too").
# Teacher-only test data. Never publish as an activity, never mint a code.

id: svg-dom-quiz-eval
target: ./0020-svg-dom-quiz.yaml

questions:
  - question: research-bounding-rect
    answers:
      - expect: correct
        answer: |
          left and top are how far the element is from the top left corner of
          the visible page, width and height are how big it is on screen
      # Names only, no descriptions.
      - expect: partial
        answer: |
          left, top, width and height
      - expect: incorrect
        answer: |
          it gives you size, position, center and color of the element

  - question: research-replace-children
    answers:
      - expect: correct
        answer: |
          canvas.replaceChildren() with nothing in the brackets. it throws out
          all children, and if you pass elements they become the new children
          instead. found it on the MDN page for Element.replaceChildren()
      # Right name, nothing about the arguments.
      - expect: partial
        answer: |
          replaceChildren, you call it on the svg and it is empty afterwards
      - expect: incorrect
        answer: |
          you loop over canvas.children and call remove() on each one

  - question: research-random-int
    answers:
      - expect: correct
        answer: |
          Math.floor(Math.random() * (50 - 10 + 1)) + 10. the + 1 makes the
          range 41 wide so floor can also give 50.
      # German correct answer for this quiz.
      - expect: correct
        answer: |
          Math.floor(Math.random() * 41) + 10, das +1 sorgt dafür dass auch 50
          rauskommen kann
      # Classic off-by-one, 50 never happens.
      - expect: partial
        answer: |
          Math.floor(Math.random() * 40) + 10
      - expect: incorrect
        answer: |
          Math.floor(Math.random() * 50) + 10

  - question: unknown-element
    answers:
      - expect: correct
        answer: |
          createElement makes an html element, html has no rect so you get an
          unknown element that is never painted. use createElementNS with the
          svg namespace instead.
      # Fix without the reason.
      - expect: partial
        answer: |
          you have to use createElementNS
      - expect: incorrect
        answer: |
          the rect has no fill, that's why you can't see it

  - question: setattribute-string
    answers:
      - expect: correct
        answer: |
          setAttribute wants a string and radius is a number, so write
          circle.setAttribute('r', String(radius));
      # Fix with no reason.
      - expect: partial
        answer: |
          just put String() around radius
      - expect: incorrect
        answer: |
          set the property instead: circle.r = radius;

  - question: event-target-shape
    answers:
      - expect: correct
        answer: |
          event.target is the circle you clicked, the click also arrives at
          the svg listener. the if stops the handler for shapes so only clicks
          on the empty background print something.
      # Target named, purpose of the if missing.
      - expect: partial
        answer: |
          event.target is the circle that was clicked
      - expect: incorrect
        answer: |
          event.target is always the svg because the listener is on the svg,
          clicks on circles never get there
