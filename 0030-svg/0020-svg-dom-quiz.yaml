discussion:
  instructions: |
    {{fragment "shared.discussion_frame"
      example="circle.setAttribute('cx', String(x));"
      scope="after the chapter on building SVG from TypeScript"
      reveal=false
      knows=(array
        "hand-written SVG inside index.html: `viewBox`, `circle`, `rect`, `line`, `polygon`, `path`, `text`, `g`, `fill`, `stroke`"
