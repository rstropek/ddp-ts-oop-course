id: svg-dom-quiz
name: "Quiz: SVG elements are DOM objects too"
title: "Check your understanding: SVG from TypeScript"
description: |
  Six short questions about the chapter *SVG elements are DOM objects too*.
  Answer in your own words. There are no answer options to pick from, and this
  quiz is anonymous: it's here for you, so you can see what you already
  understand and what you should read again. One or two sentences are enough
  for most answers, and answering in German is fine too.

