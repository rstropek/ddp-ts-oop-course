# Quiz for the book chapter "Toolchain step: scripts and assets"
# (0030-svg/0060-toolchain-assets.qmd).
# One quiz per chapter, at the end. The three research questions of the
# chapter's research box come first (ids prefixed `research-`) and get the
# research feedback rule (point to the source, never the answer). The last two
# cover the chapter's own points: what a failing type check means for the rest
# of `npm run verify`, and why `dist/` stays out of git.
# Part of the "Creative Coding 2" course (TypeScript + HTML + CSS + SVG,
# students 16-17).

