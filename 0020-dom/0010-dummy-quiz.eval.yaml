# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/evals/eval-yaml.schema.json
# Golden-answer regression cases for the placeholder chapter quiz
# (0020-dom/0010-dummy.qmd). One correct, one partial, one incorrect per
# question, plus one German correct answer per quiz. Teacher-only test data;
# never publish as an activity. Grading runs on the quiz's own small model
# (Qwen on SCCH, free); the feedback audit uses a frontier judge via
# --judge-llm-* and costs money, so run after rubric changes, not routinely.

id: dummy-quiz-eval
target: ./0010-dummy-quiz.yaml

questions:
  - question: research-return-type
    answers:
      - expect: correct
        answer: |
          a NodeList
      # Wrong name, but the idea "not an array, a list of elements" is there.
      - expect: partial
        answer: |
          some kind of list of all the li elements, not a real array
      - expect: incorrect
        answer: |
          an array of HTMLLIElement

  - question: research-loop
    answers:
      - expect: correct
        answer: |
          for (const item of items) {...} or items.forEach(item => ...)
      # German correct answer.
      - expect: correct
        answer: |
          mit for...of oder mit einer normalen for-schleife über items.length
      # Only one working way.
      - expect: partial
        answer: |
          items.forEach
      - expect: incorrect
        answer: |
          items.map(item => ...) and items.filter(item => ...)

  - question: research-live-or-static
    answers:
      - expect: correct
        answer: |
          no, it's a static nodelist, a snapshot from when you called it.
          the new li isn't in there.
      # Right answer, missing the static/snapshot aspect.
      - expect: partial
        answer: |
          no
      - expect: incorrect
        answer: |
          yes, the list is live and always shows the current li elements

  - question: identity
    answers:
      - expect: correct
        answer: |
          "x", a and b are the same element
      - expect: partial
        answer: |
          x
      - expect: incorrect
        answer: |
          still empty, b was queried separately so it's a different object
