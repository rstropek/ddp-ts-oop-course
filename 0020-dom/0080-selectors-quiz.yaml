# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/quizzes/quiz-yaml.schema.json
# Quiz for the book chapter "Selectors: asking for collections"
# (0020-dom/0080-selectors.qmd).
# One quiz per chapter, at the end. It asks every question of the chapter's
# research box first (ids prefixed `research-`), so the student finds out
# during the chapter and gets checked here; those questions get the research
# feedback rule (point to the source, never the answer). The last two
# questions cover the chapter's own concepts: what a combined descendant
# selector matches, and why only `querySelector` needs a null check.
# Part of the "Creative Coding 2" course (TypeScript + HTML + CSS + SVG,
# students 16-17).

id: selectors-quiz
name: "Quiz: Selectors and collections"

title: "Check your understanding: selectors"
description: |
  Six short questions about the chapter *Selectors: asking for
  collections*, four of them the research task. Answer in your own words;
  if you cannot answer a research question yet, look it up and come back.
  One or two sentences are enough. This quiz is anonymous and is here for
  you. Answering in German is fine too.

llm:
  model: Qwen/Qwen3.8-27B-FP8
  provider: SCCH

fragment_files:
  - id: shared
    url: "../ddp-quiz-fragments.yaml"
instructions: |
  {{fragment "shared.quiz_context"}}

  {{fragment "shared.research_context"}}

discussion:
  instructions: |
    {{fragment "shared.discussion_frame"
      example="const items = document.querySelectorAll('#shoppingList li');"
      scope="after the selectors chapter of the DOM part"
      reveal=false
      knows=(array
        "variables, conditions, loops, arrays, and functions in TypeScript from year one"
        "that the browser turns HTML into a tree of element objects (the DOM)"
        "`document.querySelector<HTMLInputElement>('#name')` for one element, plus the null check"
        "`addEventListener('click', ...)` with an arrow function as the handler"
        "`createElement`, `append`, `remove`, and `textContent`"
        "`classList.add`, `remove`, `toggle`, and `contains` together with a `src/styles.css`"
        "selectors by tag, class, id, `li.done`, descendant (`ul li`), `:hover`, `:nth-child`, and attributes"
        "`for...of` over the result of `querySelectorAll`, and `.length`")
      not_yet=(array
        "what `querySelectorAll` returns and whether it updates itself (that is the research task right now)"
        "classes, inheritance, or generics beyond `querySelector<T>`"
        "Flexbox and Grid layout"
        "forms, the submit event, and `preventDefault`")}}

questions:
  - id: research-return-type
    title: "What comes back"
    question: |
      `document.querySelectorAll('p')` does not return an array. What does
      it return, and what is that thing called?
    evaluation: |
      Expected: a `NodeList` (TypeScript writes it as
      `NodeListOf<HTMLParagraphElement>`).
      Required: names NodeList, any spelling or casing.
      Partial: describes it as a list of elements that is not a real array,
      without the name.
      Incorrect: an array, or one single element.

  - id: research-loop
    title: "Looping over it"
    question: |
      You wrote `const items = document.querySelectorAll('li');`. Name two
      different ways to visit every element in `items`.
    evaluation: |
      Expected: any two of `for...of`, `items.forEach(...)`, a counting `for`
      with `items.length` and `items[i]`, or converting to an array first and
      looping over that.
      Required: two ways that work; code or plain words both count.
      Partial: only one working way.
      Incorrect: `items.map(...)` or `items.filter(...)` offered as a way to
      loop directly over `items`.

  - id: research-live-or-static
    title: "Does it update itself?"
    question: |
      You run `const items = document.querySelectorAll('p');` and your
      program adds a new `<p>` to the page afterwards. Does `items` contain
      that new paragraph? Which word does MDN use for this behavior?
    evaluation: |
      Expected: no; `querySelectorAll` returns a static NodeList, a snapshot
      taken at the moment of the call.
      Required: (1) says no; (2) uses or explains "static" (snapshot or
      "Momentaufnahme" count).
      Partial: says no without the word or the snapshot idea, for example
      "no, it stays the same" (right answer, missing the required term).
      Incorrect: says yes, or calls the result live.

  - id: research-to-array
    title: "Getting a real array"
    question: |
      Array methods such as `map` and `filter` are missing from the result of
      `querySelectorAll`. How do you turn that result into a real array?
    evaluation: |
      Expected: `Array.from(result)`, or the spread form `[...result]`.
      Required: names one of those two conversions.
      Partial: says "convert it into an array" without naming how.
      Incorrect: claims `map` works directly on the result, or invents a
      method such as `result.toArray()`.

  - id: selector-match
    title: "Read the selector"
    question: |
      A page contains this markup:

      ```html
      <article>
        <h2>Post</h2>
        <p class="highlight">A</p>
        <p>B</p>
        <div class="post">
          <p class="highlight">C</p>
        </div>
      </article>
      <p class="highlight">D</p>
      ```

      Which paragraphs does `document.querySelectorAll('article p.highlight')`
      match, and what is its `.length`?
    evaluation: |
      Expected: A and C, so `.length` is 2. B has no class, and D is not
      inside the article.
      Required: (1) names A and C and no others; (2) the number 2.
      Partial: one of the two, for example A and C without the count, or the
      count 2 with a wrong list.
      Incorrect: includes D or B, or answers with all four paragraphs.

  - id: null-or-empty
    title: "Why only one null check"
    question: |
      After `document.querySelector('.tag')` you check the result for `null`,
      but after `document.querySelectorAll('.tag')` you do not. What does each
      call give you when the page contains no element with that class?
    evaluation: |
      Expected: `querySelector` gives `null` when nothing matches, so it is
      checked before use. `querySelectorAll` gives an empty collection with
      `.length` of 0, never `null`, so there is nothing to check.
      Required: (1) `querySelector` can be `null`; (2) `querySelectorAll`
      gives an empty collection or list instead of `null`.
      Partial: only one of the two halves.
      Incorrect: claims `querySelectorAll` returns `null` or throws an error
      when nothing matches.
