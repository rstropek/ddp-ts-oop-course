# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/quizzes/quiz-yaml.schema.json
# Quiz for the placeholder chapter (0020-dom/0010-dummy.qmd).
# One quiz per chapter, at the end. It MUST ask every question of the
# chapter's research boxes (ids prefixed `research-`), so the student finds
# out during the chapter and gets checked here; those questions get the
# research feedback rule (point to the source, never the answer). Rubrics
# list only the expected answer and the aspects the student must state; the
# shared fragments carry every generic rule.
# Part of the "Creative Coding 2" course (TypeScript + HTML + CSS + SVG,
# students 16-17).

id: dummy-quiz
name: "Quiz: Placeholder chapter"

title: "Check your understanding: placeholder chapter"
description: |
  Four short questions about this chapter, three of them the research
  task. Answer in your own words; if you cannot answer a research
  question yet, look it up and come back. This quiz is anonymous and is
  here for you. Answering in German is fine too.

llm:
  model: Qwen/Qwen3.8-27B-FP8
  provider: SCCH

fragment_files:
  - id: shared
    url: "../ddp-quiz-fragments.yaml"
instructions: |
  {{fragment "shared.quiz_context"}}

  {{fragment "shared.research_context"}}

discussion:
  instructions: |
    {{fragment "shared.discussion_frame"
      example="const items = document.querySelectorAll('li');"
      scope="after the placeholder chapter of the DOM part"
      reveal=false
      knows=(array
        "variables, conditions, loops, arrays, and functions in TypeScript from year one"
        "that the browser turns HTML into a tree of element objects (the DOM)"
        "`document.getElementById` and `document.querySelector` for one element"
        "`textContent`, `createElement`, and `append`")
      not_yet=(array
        "classes, inheritance, or generics"
        "what a NodeList is (that is what they are researching right now)")}}

questions:
  - id: research-return-type
    title: "What comes back"
    question: |
      `document.querySelectorAll("li")` does not return an array. What
      does it return?
    evaluation: |
      Expected: a `NodeList` (TypeScript: `NodeListOf<HTMLLIElement>`).
      Required: names NodeList (any spelling or casing).
      Incorrect: an array, or a single element.

  - id: research-loop
    title: "Looping over it"
    question: |
      You have `const items = document.querySelectorAll("li");`. Name two
      different ways to visit every element in `items`.
    evaluation: |
      Expected: any two of `for...of`, `items.forEach(...)`, a counting
      `for` with `items.length` and `items[i]`, `Array.from(items)` followed
      by an array loop.
      Required: two ways that work on a NodeList; code or words.
      Partial: only one working way. `items.map(...)` does not work and does
      not count.

  - id: research-live-or-static
    title: "Does it update itself?"
    question: |
      After `const items = document.querySelectorAll("li");` your program
      adds a new `li` to the page. Does `items` now contain the new element?
      Explain the word MDN uses for this behaviour.
    evaluation: |
      Expected: no; `querySelectorAll` returns a static NodeList, a snapshot
      at the time of the call (MDN contrasts it with live collections such as
      `getElementsByTagName`).
      Required: (1) says no; (2) uses or explains "static" (snapshot,
      "Momentaufnahme" count).
      Incorrect: says yes.

  - id: identity
    title: "One element, two names"
    question: |
      `const a = document.querySelector("#todos");` and
      `const b = document.querySelector("#todos");` run one after the
      other. You set `a.textContent = "x"`. What does `b.textContent` hold?
    evaluation: |
      Expected: "x". Both variables refer to the same element object; there
      is only one `#todos` in the tree.
      Required: (1) "x"; (2) because both point to the same object.
