<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather dashboard</title>
  </head>
  <body>
    <h1>Weather dashboard</h1>

    <button id="nextConditionButton" type="button">Next condition</button>

    <div id="cards">
      <div class="card sunny">
        <h2>Vienna</h2>
        <p class="temperature">24&deg;C</p>
        <p class="condition">Sunny</p>
      </div>

      <div class="card rainy">
        <h2>Linz</h2>
        <p class="temperature">17&deg;C</p>
        <p class="condition">Rainy</p>
      </div>

      <div class="card cloudy">
        <h2>Salzburg</h2>
        <p class="temperature">19&deg;C</p>
        <p class="condition">Cloudy</p>
      </div>

      <div class="card snowy">
        <h2>Innsbruck</h2>
        <p class="temperature">-2&deg;C</p>
        <p class="condition">Snowy</p>
      </div>

      <div class="card sunny">
        <h2>Graz</h2>
        <p class="temperature">26&deg;C</p>
        <p class="condition">Sunny</p>
      </div>

      <div class="card rainy">
        <h2>Bregenz</h2>
        <p class="temperature">14&deg;C</p>
        <p class="condition">Rainy</p>
      </div>
    </div>

    <script src="./src/index.ts" type="module"></script>
  </body>
</html>
