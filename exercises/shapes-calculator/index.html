<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapes calculator</title>
  </head>
  <body>
    <h1>Shapes calculator</h1>

    <p id="buttons">
      <button id="addRectangleButton" type="button">Rectangle</button>
      <button id="addSquareButton" type="button">Square</button>
      <button id="addEllipseButton" type="button">Ellipse</button>
      <button id="addCircleButton" type="button">Circle</button>
      <button id="addLineButton" type="button">Line</button>
    </p>

    <ul id="shapesList"></ul>

    <p id="total">Total area: <span id="totalArea">0.00</span></p>

    <script src="./src/index.ts" type="module"></script>
  </body>
</html>
