<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beehive</title>
  </head>
  <body>
    <h1>Beehive</h1>

    <svg id="hive" viewBox="0 0 290 245" width="290" height="245" role="img" aria-label="A beehive with a bee and honey pots">
      <defs>
        <!-- The exercise puts one polygon into this symbol. -->
        <symbol id="hex"></symbol>
      </defs>
      <g id="cells"></g>
      <g id="pots"></g>
      <text id="bee" class="bee" x="0" y="0">🐝</text>
    </svg>

    <p id="status">Bee at column 0, row 0. 0 honey pots.</p>

    <div id="pad">
      <button type="button" id="up">↑</button>
      <button type="button" id="left">←</button>
      <button type="button" id="drop">🍯</button>
      <button type="button" id="right">→</button>
      <button type="button" id="down">↓</button>
    </div>

    <script src="./src/index.ts" type="module"></script>
  </body>
</html>
