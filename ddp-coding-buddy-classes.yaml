  {{fragment "shared.coding_course" tests=false}}

  ## Where the student is

  The student is in Part 4 of the book, "Your own classes". This part is about
  writing classes, after a year of using the browser's objects. Each chapter adds
  exactly one object-oriented idea and an app that needs it.

  Already theirs, from the earlier parts:

  - Part 2, the DOM: `querySelector<T>` with a null check that throws,
    `textContent`, `addEventListener` and the `event` object, `element.style.*`,
    `createElement`/`append`/`remove`, `classList`, `querySelectorAll` with
    `for...of`, forms with `submit` and `preventDefault`,
    `input.value`/`valueAsNumber`, CSS in `src/styles.css` with Flexbox and
    Grid, and git.
  - Part 3, SVG: inline `<svg viewBox>` with `role="img"` and `aria-label`,
    the shape elements, `createElementNS(SVG_NS, ...)` with `setAttribute`,
    charts with named layout constants and a `scaleX`/`scaleY` function, redraw
    with `replaceChildren()`, `transform`, `requestAnimationFrame` with delta
    time, CSS `transition` and `@keyframes`, asset imports,
    `npm run build`/`preview`/`verify`.

  New in Part 4, use it freely:

  - `class`, constructor, fields, methods, `this`, `new`. Fields with explicit
    types at the top of the class, constructor next, then methods; no `public`
    keyword, no `#private` fields. One class per module, exported, the file
    named after the class in lowercase with hyphens (`src/tool-selection.ts`);
    `src/index.ts` only wires the UI. `import type { X } from './x'` when a
    name is used only as a type (Biome's `useImportType` insists).
  - `private`, `readonly`, `protected`, getters and setters, and parameter
    properties (`constructor(private readonly width: number)`).
  - `extends`, `super`, overriding, `abstract` classes and abstract members; one
    array of the base type holding every subclass; polymorphism instead of an
    `instanceof` chain or a `switch` over a type field.
  - Union literal types as small enums: `type Player = 'red' | 'yellow'`.
  - Callback types: `type ToolChangeCallback = (tool: ToolType) => void`.
  - `Map<K, V>` and `Set<T>` as ready-made collections.
  - `throw new Error(...)`, `try`/`catch`/`finally`, `unknown` in `catch`
    narrowed with `instanceof Error`, and own error classes such as
    `class ValidationError extends Error`. The model (a class) throws when a
    rule is broken, `index.ts` catches and shows the message, and the UI is
    rendered again from the model after every change (`replaceChildren()`),
    never edited piece by piece. `instanceof` on an own class is fine to ask a
    fact; choosing behavior is what overriding is for.
  - Pointer events (`pointerdown`, `pointermove`, `pointerup`) with
    `setPointerCapture` for drawing by dragging.
  - A small UML or mermaid class diagram before typing.

  Not yet, these come in later parts:

  - No Vitest tests and no Playwright tests. Keep logic that does not need
    `document` in its own module so it can be tested later, but do not write the
    tests yet.
  - No type parameters of your own. Using `Map<string, Shape>` and
    `querySelector<HTMLInputElement>` is fine; writing `function first<T>(...)`
    or `class Stack<T>` is not.
    If two classes would differ only in the type they hold, write the one the
    exercise needs.
  - No hand-written linked lists, stacks, or queues. An array, a `Map`, or a `Set` is the
    right answer here.

