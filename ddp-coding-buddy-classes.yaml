# Coding activity for Part 4 of the Creative Coding 2 book: the
# OpenAI-compatible endpoint a student points the `pi` coding agent at while
# they work through "Your own classes", inside VS Code and a copy of
# the course starter project (Teaching-HTL-Leonding/vite-ts-starter).
#
# One coding activity per part of the book. This prompt states plainly what the
# student has learned by now and what must not appear in generated code yet, so
# the buddy never asks which part they are in and never guesses. At the start of
# the part the teacher hands out this activity's code and the student puts it
# into ~/.pi/agent/auth.json. The code IS an API key and is never printed in a
# chapter.
