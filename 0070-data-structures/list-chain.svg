<svg xmlns="http://www.w3.org/2000/svg" width="808" height="128" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="808" height="128"></rect>
  <text x="18" y="12" >head</text>
  <line x1="36" y1="16" x2="36" y2="36" class="solid"></line>
  <polygon points="32,36 40,36 36,48" class="filled"></polygon>
  <text x="194" y="92" >next</text>
  <line x1="240" y1="88" x2="280" y2="88" class="solid"></line>
  <polygon points="280,84 288,88 280,92" class="filled"></polygon>
  <text x="466" y="92" >next</text>
  <line x1="512" y1="88" x2="552" y2="88" class="solid"></line>
  <polygon points="552,84 560,88 552,92" class="filled"></polygon>
  <text x="34" y="76" >Yellow</text>
  <text x="306" y="76" >Believer</text>
  <text x="578" y="76" >Levitating</text>
  <text x="34" y="92" >Coldplay</text>
  <text x="306" y="92" >Imagine Dragons</text>
  <text x="578" y="92" >Dua Lipa</text>
  <text x="738" y="92" >null</text>
  <g>
    <line x1="20" y1="56" x2="260" y2="56" class="solid"></line>
    <line x1="20" y1="56" x2="20" y2="104" class="solid"></line>
    <line x1="180" y1="56" x2="180" y2="104" class="solid"></line>
    <line x1="260" y1="56" x2="260" y2="104" class="solid"></line>
    <line x1="20" y1="104" x2="260" y2="104" class="solid"></line>
  </g>
  <g>
    <line x1="292" y1="56" x2="532" y2="56" class="solid"></line>
    <line x1="292" y1="56" x2="292" y2="104" class="solid"></line>
    <line x1="452" y1="56" x2="452" y2="104" class="solid"></line>
    <line x1="532" y1="56" x2="532" y2="104" class="solid"></line>
    <line x1="292" y1="104" x2="532" y2="104" class="solid"></line>
  </g>
  <g>
    <line x1="564" y1="56" x2="796" y2="56" class="solid"></line>
    <line x1="564" y1="56" x2="564" y2="104" class="solid"></line>
    <line x1="724" y1="56" x2="724" y2="104" class="solid"></line>
    <line x1="796" y1="56" x2="796" y2="104" class="solid"></line>
    <line x1="564" y1="104" x2="796" y2="104" class="solid"></line>
  </g>
</svg>