<svg xmlns="http://www.w3.org/2000/svg" width="456" height="144" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="456" height="144"></rect>
  <text x="50" y="12" >head</text>
  <text x="298" y="12" >tail</text>
  <line x1="68" y1="16" x2="68" y2="36" class="solid"></line>
  <line x1="316" y1="16" x2="316" y2="36" class="solid"></line>
  <polygon points="64,36 72,36 68,48" class="filled"></polygon>
  <polygon points="312,36 320,36 316,48" class="filled"></polygon>
  <text x="50" y="76" >Anna</text>
  <polygon points="144,68 152,72 144,76" class="filled"></polygon>
  <text x="178" y="76" >Ben</text>
  <polygon points="272,68 280,72 272,76" class="filled"></polygon>
  <text x="298" y="76" >Chiara</text>
  <polygon points="400,68 408,72 400,76" class="filled"></polygon>
  <text x="418" y="76" >null</text>
  <text x="26" y="124" >dequeue</text>
  <text x="90" y="124" >here</text>
  <text x="282" y="124" >enqueue</text>
  <text x="346" y="124" >here</text>
  <g>
    <line x1="28" y1="56" x2="100" y2="56" class="solid"></line>
    <line x1="28" y1="56" x2="28" y2="88" class="solid"></line>
    <line x1="100" y1="56" x2="100" y2="88" class="solid"></line>
    <line x1="100" y1="72" x2="144" y2="72" class="solid"></line>
    <line x1="28" y1="88" x2="100" y2="88" class="solid"></line>
  </g>
  <g>
    <line x1="156" y1="56" x2="228" y2="56" class="solid"></line>
    <line x1="156" y1="56" x2="156" y2="88" class="solid"></line>
    <line x1="228" y1="56" x2="228" y2="88" class="solid"></line>
    <line x1="228" y1="72" x2="272" y2="72" class="solid"></line>
    <line x1="156" y1="88" x2="228" y2="88" class="solid"></line>
  </g>
  <g>
    <line x1="284" y1="56" x2="356" y2="56" class="solid"></line>
    <line x1="284" y1="56" x2="284" y2="88" class="solid"></line>
    <line x1="356" y1="56" x2="356" y2="88" class="solid"></line>
    <line x1="356" y1="72" x2="400" y2="72" class="solid"></line>
    <line x1="284" y1="88" x2="356" y2="88" class="solid"></line>
  </g>
</svg>