# Quiz for the book chapter "A loop your own class understands"
# (0070-data-structures/0020-iteration.qmd).
# One quiz per chapter, at the end. This chapter has no research box, so there
# are no `research-` questions and no research fragment. The four questions
# cover the chapter's own points: why `for...of` refused the playlist, who
# calls a callback and how often, what a counter field costs compared with the
# walking getter, and when an array beats a visit.
# Part of the "Creative Coding 2" course (TypeScript + HTML + CSS + SVG,
# students 16-17).

id: iteration-quiz
name: "Quiz: A loop your own class understands"

title: "Check your understanding: a loop your own class understands"
description: |
  Four short questions about the chapter *A loop your own class understands*.
  Answer in your own words; there is nothing to pick from a list. One or two
  sentences are enough. This quiz is anonymous and is here for you, so you can
  see what already sits and what you should read again. Answering in German is
  fine too.

