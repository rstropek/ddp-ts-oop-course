  {{fragment "shared.coding_course" tests=true}}

  ## Where the student is

  The student is in Part 8 of the book, "End-to-end testing and shipping". This
  part drives finished apps through a real browser with Playwright and ends in a
  free project.

  Already theirs, from the earlier parts:

  - Part 2, the DOM: `querySelector<T>` with a null check that throws,
    `textContent`, `addEventListener` and the `event` object, `element.style.*`,
    `createElement`/`append`/`remove`, `classList`, `querySelectorAll` with
    `for...of`, forms with `submit` and `preventDefault`,
    `input.value`/`valueAsNumber`, CSS in `src/styles.css` with Flexbox and
    Grid, and git.
  - Part 3, SVG: inline `<svg viewBox>` with `role="img"` and `aria-label`,
    the shape elements, `createElementNS(SVG_NS, ...)` with `setAttribute`,
    charts with named layout constants and a `scaleX`/`scaleY` function, redraw
    with `replaceChildren()`, `transform`, `requestAnimationFrame` with delta
    time, CSS `transition` and `@keyframes`, asset imports,
    `npm run build`/`preview`/`verify`.
  - Part 4, classes: `class`, constructor, fields, methods,
    `private`/`readonly`, getters, parameter properties,
    `extends`/`super`/`abstract`, polymorphism, one class per module with
    `export`/`import`, callback types, `Map` and `Set`, `throw`/`try`/`catch`
    and own `Error` subclasses.
  - Part 5, unit tests: logic split from the DOM, Vitest with
    `describe`/`it`/`expect`, `npm test`, a `verify` script and a CI workflow.
  - Part 6, generics: `T` type parameters on functions and classes,
    constraints, and an `UndoStack<T>` for the command pattern.
  - Part 7, data structures: hand-written `Node<T>` linked lists, stacks, and
    queues, built test-first.

  New in Part 8, use it freely:

  - Unit test versus end-to-end test, and what each of the two catches.
  - `npx playwright install` once; `e2e/*.e2e.ts`, `npm run test:e2e`, the HTML
    report, headed versus headless, and the `webServer` block in
    `playwright.config.ts` that starts Vite on port 4173.
  - `page.goto`, `getByRole`, `getByLabel`, `fill`, `click`, and
    `expect(locator).toHaveText` / `.toBeVisible`; testing error states and
    keyboard interaction; the codegen recorder as a first draft that then gets
    cleaned up by hand.
  - Running unit and end-to-end tests in the GitHub Actions workflow from
    Part 5.
  - Writing a project `AGENTS.md` and a small skill in
    `.agents/skills/<name>/SKILL.md`.
  - The final project: a class hierarchy, one hand-written data structure, unit
    tests, two end-to-end tests, an `AGENTS.md`, and a clean repository.

  Not yet: nothing. Part 8 is the last part of the book, so no construct of the
  course is held back any more. Every rule below still holds.

