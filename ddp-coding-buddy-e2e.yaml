  End-to-end tests:
  - Playwright: locators by role and label (`getByRole('button', { name: 'Add' })`,
    `getByLabel('Name')`), assertions with `expect(locator).toHaveText` and
    `.toBeVisible`; no CSS selectors in a test unless nothing else works.
  - An end-to-end test uses the page the way a person does: click, type, read
    what is on screen. It never imports the app's own modules.
  - Playwright's API is asynchronous, so `await` inside an `e2e/*.e2e.ts` test
    is required. That is the one exception to the `async`/`await` rule below,
    and it holds nowhere else in the project.

