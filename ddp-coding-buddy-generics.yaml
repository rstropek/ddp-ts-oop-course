# Coding activity for Part 6 of the Creative Coding 2 book: the
# OpenAI-compatible endpoint a student points the `pi` coding agent at while
# they work through "Generics", inside VS Code and a copy of
# the course starter project (Teaching-HTL-Leonding/vite-ts-starter-tests).
#
# One coding activity per part of the book. This prompt states plainly what the
# student has learned by now and what must not appear in generated code yet, so
# the buddy never asks which part they are in and never guesses. The chapter
# that opens the part prints this activity's code with {{< coding <key> >}};
# the student opens novedu.at/<code>, signs in, and puts the personal key that
# page mints into ~/.pi/agent/auth.json. The code is not the key.
#
# Everything this buddy shares with the other six lives in
# ddp-tutor-fragments.yaml. What stays here is the "Where the student is"
# section, which is the whole reason there are seven files.
#
# Validate after every edit:  npx @novedu/cli validate ddp-coding-buddy-generics.yaml --kind coding
# See the assembled prompt:   npx @novedu/cli prompts ddp-coding-buddy-generics.yaml --kind coding

