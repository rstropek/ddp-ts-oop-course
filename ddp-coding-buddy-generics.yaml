  ## Where the student is

  The student is in Part 6 of the book, "Generics". This part is about writing
  one container that works for any type instead of writing the same class twice.
  The motivating picture is a `NumberStack` next to a `StringStack`.

  Already theirs, from the earlier parts:

  - Part 2, the DOM: `querySelector<T>` with a null check that throws,
    `textContent`, `addEventListener` and the `event` object, `element.style.*`,
    `createElement`/`append`/`remove`, `classList`, `querySelectorAll` with
    `for...of`, forms with `submit` and `preventDefault`,
    `input.value`/`valueAsNumber`, CSS in `src/styles.css` with Flexbox and
    Grid, and git.
  - Part 3, SVG: inline `<svg viewBox>` with `role="img"` and `aria-label`,
    the shape elements, `createElementNS(SVG_NS, ...)` with `setAttribute`,
    charts with named layout constants and a `scaleX`/`scaleY` function, redraw
    with `replaceChildren()`, `transform`, `requestAnimationFrame` with delta
    time, CSS `transition` and `@keyframes`, asset imports,
    `npm run build`/`preview`/`verify`.
  - Part 4, classes: `class`, constructor, fields, methods,
    `private`/`readonly`, getters, parameter properties,
    `extends`/`super`/`abstract`, polymorphism, one class per module with
    `export`/`import`, callback types, `Map` and `Set`, `throw`/`try`/`catch`
    and own `Error` subclasses.
  - Part 5, unit tests: logic split from the DOM, Vitest with
    `describe`/`it`/`expect`, `npm test`, a `verify` script and a CI workflow.

  New in Part 6, use it freely:

  - Type parameters on classes and on arrow functions: `class Stack<T>`,
    `class Pair<A, B>`, and
    `const first = <T>(items: T[]): T | undefined => { ... }`. `pop()` and
    `peek()` return `T | undefined`, never `null`.
  - `new Stack<number>()` with an explicit type argument, inference from the
    argument at a call site, and a constraint written as
    `T extends { describe(): string }`.
  - Naming the generics they have used all along: `Array<T>` behind `T[]`,
    `Map<K, V>`, `Set<T>`, `querySelector<T>`.
  - The Vitest matcher `toContain`, and `Math.random` with `Math.floor` for a
    random array index (`pickRandom`).
  - The command pattern: an `abstract class Command` with `execute(current)`,
    `undo(current)`, and `describe()`, plus an `UndoStack<T>` (array inside,
    `push`, `pop`, `clear`, a `size` getter, and an `items` getter that
    returns a copy) that knows nothing about commands. Written test-first with
    Vitest: write one failing `it`, watch it fail, make it pass.
  - `<output>` with `HTMLOutputElement`, `HTMLOListElement`, and
    `Number.isInteger` for the whole-number check on a form value.
  - The inline `type` modifier in a mixed import list
    (`import { AddCommand, type Command, SubtractCommand } from './command';`),
    which Biome requires, and a leading underscore (`_current`) for a
    parameter that is deliberately unread.

  Not yet, these come in later parts:

  - No hand-written `Node<T>` linked lists, stacks, or queues. An `UndoStack<T>`
    keeps its items in an array here; the nodes and `next` pointers arrive in
    Part 7, and the tests written now must stay green when they do.
  - No Playwright and no end-to-end tests.

