# Quiz for the book chapter "Polymorphism, and one class per file"
# (0040-classes/0040-polymorphism.qmd).
# One quiz per chapter, at the end. The three research questions of the
# chapter's research box come first (ids prefixed `research-`) and get the
# research feedback rule (point to the source, never the answer). The last
# three cover the chapter's own points: what a `switch` over a kind field
# costs compared with a class per kind, the two lines that move a class into
# its own file, and why one import needs the real class while the other does
# not.
# Part of the "Creative Coding 2" course (TypeScript + HTML + CSS + SVG,
# students 16-17).

