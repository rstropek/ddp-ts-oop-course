discussion:
  instructions: |
    {{fragment "shared.discussion_frame"
      example="const shapes: Shape[] = [new Rect(30, 20), new Line(30)];"
      scope="after the polymorphism and modules chapter of the classes part"
      reveal=false
      knows=(array
        "variables, conditions, loops, arrays, and functions in TypeScript from year one"
