questions:
  - id: research-two-decimals
    title: "Two decimals"
    question: |
      An area comes out as `3216.990877275948`, and the page should show
      `3216.99`. Which method of a number gives you that text, and what type
      does the method return?
    evaluation: |
      Expected: `toFixed(2)`, called on the number. It returns a string, not
      a number.
      Required: (1) names `toFixed` (any argument, `2` is the case here);
      (2) says the result is a string.
      Partial: names `toFixed` but calls the result a number, or says "a
      string" without naming the method.
      Incorrect: answers only `Math.round` or `Math.floor`, or claims
      `toFixed` changes the number itself.

  - id: research-default-export
    title: "Two kinds of export"
    question: |
      Besides a named export such as `export class Rectangle`, a file can use
      `export default`. How does importing a default export differ from
      importing a named export?
    evaluation: |
      Expected: a named export is imported inside braces under its exact
      exported name, `import { Rectangle } from './rectangle';`. A default
      export is imported without braces and the importing file picks the
      name itself, `import Whatever from './rectangle';`. A file has at most
      one default export.
      Required: (1) named export: braces and the matching name; (2) default
      export: no braces and a name the importing file chooses.
      Partial: only one of the two, for example the braces rule without the
      free name for the default.
      Incorrect: says both are written the same way, or that a file can have
      several default exports.

  - id: research-import-path
    title: "Where an import looks"
    question: |
      `import { Rectangle } from './rectangle';` and
      `import { defineConfig } from 'vite';` are both imports. What does the
      leading `./` say about where the file is looked for, and where does the
      search go when the `./` is missing?
    evaluation: |
      Expected: `./` makes it a relative path, resolved from the folder of
      the file that contains the import, so `./rectangle` is the
      `rectangle.ts` sitting next to it. Without `./` the text is a package
      name and the tool looks for an installed package in `node_modules`.
      Required: (1) `./` means relative to the importing file's own folder;
      (2) a bare name means an installed package, found in `node_modules`.
      Partial: only one of the two halves.
      Incorrect: says `./` means the project root, or that both spellings
      search in the same place.

  - id: switch-versus-classes
    title: "One more kind of shape"
    question: |
      A file holds four functions built like this one, all switching over the
      same `kind`:

      ```ts
      const area = (shape: Shape): number => {
        switch (shape.kind) {
          case 'rect':
            return shape.width * shape.height;
          case 'triangle':
            return (shape.width * shape.height) / 2;
        }
      };
      ```

      You add `'line'` to the union type. What happens, and what would the
      same change cost if every shape were a class with its own `area()`
      method?
    evaluation: |
      Expected: all four functions stop compiling, because a `switch` with no
      branch for `'line'` can now reach the end without returning, so you add
      a `case` in four places. With classes you write one new class `Line`
      with its own `area()` and change nothing that already exists.
      Required: (1) every switch needs a new branch, and the compiler reports
      the ones that are missing; (2) the class version costs one new class
      and no edit to existing code.
      Partial: only one of the two halves.
      Incorrect: says nothing happens and the program keeps working, or that
      the class version also has to be edited in four places.

  - id: export-and-import
    title: "Moving a class out"
    question: |
      You move `class Rectangle` out of `src/index.ts` into a new file
      `src/rectangle.ts`. `src/index.ts` now reports
      `Cannot find name 'Rectangle'`. Name the two lines that fix this, and
      say which file each one belongs in.
    evaluation: |
      Expected: in `src/rectangle.ts` the class declaration gets `export` in
      front of it, `export class Rectangle ...`. In `src/index.ts` a line
      `import { Rectangle } from './rectangle';` goes at the top.
      Required: (1) `export` in front of the class in `rectangle.ts`; (2) an
      import of `Rectangle` from `'./rectangle'` in `index.ts`.
      Partial: only one of the two, or an import that names the wrong file.
      Incorrect: adds a second `<script>` tag to `index.html`, or claims the
      class is found automatically because both files are in `src`.

  - id: import-type
    title: "Why one import keeps its class"
    question: |
      `src/rect.ts` begins with `import { Shape } from './shape';` and
      `src/index.ts` begins with `import type { Shape } from './shape';`.
      Both files import the same class. Why can `src/rect.ts` not use
      `import type` as well?
    evaluation: |
      Expected: `rect.ts` writes `class Rect extends Shape`, and `extends`
      needs the real class while the program runs, so the import must bring a
      value. `index.ts` uses the name only as a type annotation, in
      `const shapes: Shape[]`, and a type-only import is removed from the
      built code.
      Required: (1) `rect.ts` uses `Shape` as a value at run time, because of
      `extends` (or `new`); (2) `index.ts` uses the name only as a type.
      Partial: says `import type` is only for types without connecting it to
      `extends` needing the real class.
      Incorrect: says `import type` is just faster or shorter, or that the
      two lines mean the same thing.
