# Quiz for the book chapter "Class diagrams: design before you type"
# (0040-classes/0050-class-diagrams.qmd).
# The three research questions of the chapter's research box come first (ids
# prefixed `research-`) and get the research feedback rule (point to the
# source, never the answer). The last three cover the chapter's own points:
# turning box notation into TypeScript members, telling the two arrows apart,
# and deciding which box a field belongs in.
# Part of the "Creative Coding 2" course (TypeScript + HTML + CSS + SVG,
# students 16-17).

