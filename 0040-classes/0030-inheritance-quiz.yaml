# Quiz for the book chapter "Inheritance and abstract classes"
# (0040-classes/0030-inheritance.qmd).
# The first three questions are the chapter's research box (ids `research-*`):
# they get the research feedback rule, so the grader names the source instead
# of the answer. The last three check the chapter's own concepts: protected,
# abstract members, and one array holding several kinds of ball.
# Part of the "Creative Coding 2" course (TypeScript + HTML + CSS + SVG,
# students 16-17).

