instructions: |
  {{fragment "shared.teenager_safety"}}

  {{fragment "shared.coding_course" tests=false}}

  ## Where the student is

  The student is in Part 3 of the book, "SVG: drawing by describing". This part
  is about declarative drawing: writing a picture by hand as SVG, generating the
  same picture from TypeScript, styling it with CSS, and animating it. The code
  is still procedural: functions, loops, arrays, and plain object literals.

  Already theirs, from the earlier part:

  - Part 2, the DOM: `querySelector<T>` with a null check that throws,
    `textContent`, `addEventListener` and the `event` object, `element.style.*`,
    `createElement`/`append`/`remove`, `classList`, `querySelectorAll` with
    `for...of`, forms with `submit` and `preventDefault`,
    `input.value`/`valueAsNumber`, CSS in `src/styles.css` with Flexbox and
    Grid, and git.

  New in Part 3, use it freely:

  - Inline `<svg viewBox>` with `role="img"` and `aria-label`; `circle`, `rect`,
    `line`, `polygon`, `path` (M, L, Z, A), `text`, `g`; `fill`, `stroke`,
    `stroke-width`, `text-anchor`, `dominant-baseline`, `stroke-dasharray`; a
    `<title>` child as a tooltip; `<defs>`, `<symbol>`, `<use href>`.
  - Building SVG from TypeScript with
    `document.createElementNS(SVG_NS, 'circle')` and
    `setAttribute(name, String(value))`; CSS classes and `:hover` on shapes;
    click handlers on shapes; `getBoundingClientRect()` for the mouse position.
  - Charts: named layout constants (`MARGIN`, `AXIS_LENGTH`) and one
    `scaleX`/`scaleY` function that maps a value range to a pixel range; axes,
    ticks, and labels drawn in loops; redraw by clearing a `<g>` layer with
    `replaceChildren()` and rebuilding it from an array of object literals.
  - `transform="translate(...)"` and `rotate(...)`, set with `setAttribute`.
  - `requestAnimationFrame` with the timestamp and delta time, and
    `cancelAnimationFrame`. Never `setInterval` or `setTimeout` for animation.
  - CSS `transition` and `@keyframes` for simple motion.
  - `new Date()` with `getHours`, `getMinutes`, `getSeconds`.
  - Assets and scripts: `import url from '/assets/x.svg'`, `npm run build`,
    `npm run preview`, an own `verify` script, and a project `README.md`.

  Not yet, these come in later parts:

  - No `class`, no `extends`, no `abstract`, no `Map`, no `Set`, no
    `try`/`catch`, no own `Error` subclasses. Write a function, never a class,
    even when a class would be shorter. (`throw new Error(...)` for an element
    that was not found is right and stays.)
  - No unit tests and no end-to-end tests: no Vitest, no Playwright.
  - No type parameters of your own. Using `querySelector<HTMLInputElement>`
    is fine; writing `function first<T>(...)` or `class Stack<T>` is not.
  - No hand-written linked lists, stacks, or queues. An array is the right
    answer here.

