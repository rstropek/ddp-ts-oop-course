# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/registry/registry-yaml.schema.json
# Activity registry for the Creative Coding 2 book.
#
# Every novedu activity a chapter links to is listed here under a stable KEY;
# the chapters reference that key, never a code:
#
#     {{< quiz dom-basics title="The DOM" >}}
#
# Reconcile it with novedu and regenerate the lock file with:
#
#     npx @novedu/cli codes sync ddp-activities.yaml
#
# Commit BOTH this file and ddp-activities.lock.yaml. Full format reference:
# https://github.com/Teaching-HTL-Leonding/novedu-chat-mvp/blob/main/docs/registry.md

# novedu re-reads the activity YAML from this repository's raw URLs on every
# load, so publishing a quiz or tutor edit stays a plain `git push`.
base-url: "https://raw.githubusercontent.com/rstropek/ddp-ts-oop-course/refs/heads/main/"

activities:
  # The one coding activity of the year: the endpoint students point the `pi`
  # coding agent at, from the first chapter on. The code IS the API key, so
  # the book explains the setup and the teacher hands the code out in class.
  coding:
    coding-buddy:
      file: ddp-coding-buddy.yaml
      note: "Creative Coding 2 book: coding buddy with the course coding guidelines built in (whole year) — GitHub-hosted"

  tutors: {}

  # Writing activities: the student drafts a text, an AI coach reads it and
  # asks questions but cannot edit it. Not anonymous: the teacher reads the
  # saved texts.
  writing:
    research-guide:
      file: 0020-dom/0085-research-guide-writing.yaml
      note: "Creative Coding 2 book: Your own research guide (0085), personal research guide reflection — GitHub-hosted"

  # One quiz per chapter, keyed by chapter slug. Each quiz also asks the
  # chapter's research-box questions (ids `research-*`).
  quizzes:
    elements-are-objects:
      file: 0020-dom/0010-elements-are-objects-quiz.yaml
      note: "Creative Coding 2 book: Elements are objects (0010) — GitHub-hosted"
    events:
      file: 0020-dom/0020-events-quiz.yaml
      note: "Creative Coding 2 book: Events: the page talks back (0020) — GitHub-hosted"
    starter-project:
      file: 0020-dom/0030-starter-project-quiz.yaml
      note: "Creative Coding 2 book: The starter project, file by file (0030) — GitHub-hosted"
    types-for-elements:
      file: 0020-dom/0040-types-for-elements-quiz.yaml
      note: "Creative Coding 2 book: Types for elements (0040) — GitHub-hosted"
    research:
      file: 0020-dom/0050-research-quiz.yaml
      note: "Creative Coding 2 book: Research is part of the job (0050) — GitHub-hosted"
    creating-elements:
      file: 0020-dom/0060-creating-elements-quiz.yaml
      note: "Creative Coding 2 book: Creating elements (0060) — GitHub-hosted"
    selectors:
      file: 0020-dom/0080-selectors-quiz.yaml
      note: "Creative Coding 2 book: Selectors: asking for collections (0080) — GitHub-hosted"
    git:
      file: 0020-dom/0090-git-quiz.yaml
      note: "Creative Coding 2 book: Git and your course repository (0090) — GitHub-hosted"
    layout:
      file: 0020-dom/0100-layout-quiz.yaml
      note: "Creative Coding 2 book: CSS by doing: layout with Flexbox and Grid (0100) — GitHub-hosted"
    forms:
      file: 0020-dom/0110-forms-quiz.yaml
      note: "Creative Coding 2 book: Forms and validation (0110) — GitHub-hosted"
    svg-by-hand:
      file: 0030-svg/0010-svg-by-hand-quiz.yaml
      note: "Creative Coding 2 book: A picture made of text (0010) — GitHub-hosted"
    svg-dom:
      file: 0030-svg/0020-svg-dom-quiz.yaml
      note: "Creative Coding 2 book: SVG elements are DOM objects too (0020) — GitHub-hosted"
    charts:
      file: 0030-svg/0030-charts-quiz.yaml
      note: "Creative Coding 2 book: Charts: scaling data to pixels (0030) — GitHub-hosted"
    animation:
      file: 0030-svg/0040-animation-quiz.yaml
      note: "Creative Coding 2 book: Animation with requestAnimationFrame (0040) — GitHub-hosted"
    beehive:
      file: 0030-svg/0050-beehive-quiz.yaml
      note: "Creative Coding 2 book: Grids, hexagons, and a small game (0050) — GitHub-hosted"
    toolchain-assets:
      file: 0030-svg/0060-toolchain-assets-quiz.yaml
      note: "Creative Coding 2 book: Toolchain step: scripts and assets (0060) — GitHub-hosted"
