# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/registry/registry-yaml.schema.json
# Activity registry for the Creative Coding 2 book.
#
# Every Novedu activity a chapter links to is listed here under a stable KEY;
# the chapters reference that key, never a code:
#
#     {{< quiz dom-basics title="The DOM" >}}
#
# Reconcile it with Novedu and regenerate the lock file with:
#
#     npx @novedu/cli codes sync ddp-activities.yaml
#
# Commit BOTH this file and ddp-activities.lock.yaml. Full format reference:
# https://github.com/Teaching-HTL-Leonding/novedu-chat-mvp/blob/main/docs/registry.md

# Novedu re-reads the activity YAML from this repository's raw URLs on every
# load, so publishing a quiz or tutor edit stays a plain `git push`.
base-url: "https://raw.githubusercontent.com/rstropek/ddp-ts-oop-course/refs/heads/main/"

activities:
  # One coding activity per part of the book: the endpoint students point the
  # `pi` coding agent at. Each level's prompt names what that part has taught
  # and forbids what comes later; there is no level detection.
  #
  # The code is NOT the API key: a student opens <base>/<code>, signs in, and
  # the page mints them a personal `nvk-` key for their tool. So the code is
  # safe to print, and the chapter that opens a part links it with
  # {{< coding <key> >}} like any quiz. What the student swaps into
  # ~/.pi/agent/auth.json at the start of a part is that part's key, not a code
  # from the teacher.
  coding:
    coding-buddy-dom:
      file: ddp-coding-buddy-dom.yaml
      note: "Creative Coding 2 book: coding buddy, Part 2 The DOM — GitHub-hosted"
    coding-buddy-svg:
      file: ddp-coding-buddy-svg.yaml
      note: "Creative Coding 2 book: coding buddy, Part 3 SVG — GitHub-hosted"
    coding-buddy-classes:
      file: ddp-coding-buddy-classes.yaml
      note: "Creative Coding 2 book: coding buddy, Part 4 Classes — GitHub-hosted"
    coding-buddy-tests:
      file: ddp-coding-buddy-tests.yaml
      note: "Creative Coding 2 book: coding buddy, Part 5 Testing — GitHub-hosted"
    coding-buddy-generics:
      file: ddp-coding-buddy-generics.yaml
      note: "Creative Coding 2 book: coding buddy, Part 6 Generics — GitHub-hosted"
    coding-buddy-data-structures:
      file: ddp-coding-buddy-data-structures.yaml
      note: "Creative Coding 2 book: coding buddy, Part 7 Data structures — GitHub-hosted"
    coding-buddy-e2e:
      file: ddp-coding-buddy-e2e.yaml
      note: "Creative Coding 2 book: coding buddy, Part 8 End-to-end testing — GitHub-hosted"

  tutors: {}

  # Writing activities: the student drafts a text, an AI coach reads it and
  # asks questions but cannot edit it. Not anonymous: the teacher reads the
  # saved texts.
  writing:
    research-guide:
      file: 0020-dom/0085-research-guide-writing.yaml
      note: "Creative Coding 2 book: Your own research guide (0085), personal research guide reflection — GitHub-hosted"

  # One quiz per chapter, keyed by chapter slug. Each quiz also asks the
